[package]
name = "pico-device-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Bounded no_std USB diagnostic protocol and touch tracking for Pico 2"
license = "MIT"

[features]
default = []
std = ["serde/std"]

[dependencies]
serde = { version = "=1.0.228", default-features = false, features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false }
heapless = "=0.8.0"
