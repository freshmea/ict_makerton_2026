[package]
name = "pico-device-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
pico-device-protocol = { path = "../../crates/pico-device-protocol", features = ["std"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal"] }
tokio-serial = { version = "=5.4.5", default-features = false }
serialport = { version = "=4.8.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.2.16"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["test-util"] }

[profile.release]
strip = true
