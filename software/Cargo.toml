[workspace]
members = ["crates/host-core", "services/nano-runtime"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal", "process", "fs"] }
libc = "=0.2.191"

[profile.release]
strip = true
